name: Bug report
description: Report reproducible incorrect behavior in Opah
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, remove passwords, server addresses, camera names or images, and unedited logs. Report possible security problems privately instead of using this form.
  - type: input
    id: opah_version
    attributes:
      label: Opah version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: frigate_version
    attributes:
      label: Frigate version
      placeholder: 0.17.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android TV / Google TV device and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: List the remote-control buttons or menu choices that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: sanitized_diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Copy only the information shown on Opah's Diagnostics page after checking it for private details. Do not paste complete device logs or your Frigate configuration.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed passwords, server addresses, camera names or images, and other private information.
          required: true
