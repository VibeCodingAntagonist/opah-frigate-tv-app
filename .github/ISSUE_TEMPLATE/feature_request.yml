name: Feature request
description: Suggest a television-focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain what you want to do with the television remote and why it would help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: frigate_version
    attributes:
      label: Relevant Frigate version
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This idea can be used with a television remote and does not require a touch screen.
          required: true
        - label: This request contains no passwords, server addresses, camera names or images, or other private information.
          required: true
